name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/sources/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tender-monitor/sources setup
      - run: pnpm lint
      - run: pnpm --filter @tender-monitor/sources lint
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test
