name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'packages/worker/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      # database_name in packages/worker/wrangler.toml is "tender-monitor".
      # The database_id there is a PLACEHOLDER until you run `wrangler d1 create tender-monitor`.
      - name: Apply D1 migrations
        working-directory: packages/worker
        run: pnpm exec wrangler d1 migrations apply tender-monitor --remote
      - name: Deploy
        working-directory: packages/worker
        run: pnpm exec wrangler deploy
